version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: dishgenie_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dishgenie_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dishgenie_password}
      POSTGRES_DB: ${POSTGRES_DB:-dishgenie_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dishgenie_user} -d ${POSTGRES_DB:-dishgenie_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: dishgenie_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dishgenie_rmq_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-dishgenie_rmq_password}
    ports:
      - "5672:5672"    # AMQP protocol port
      - "15672:15672"  # Web Management Dashboard
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis In-Memory Cache Service
  redis:
    image: redis:7-alpine
    container_name: dishgenie_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: dishgenie_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-dishgenie_minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-dishgenie_miniopassword}
    ports:
      - "9000:9000"  # MinIO API port
      - "9001:9001"  # MinIO Web Console port
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. One-shot Bucket Creator for MinIO
  create-bucket:
    image: minio/mc:latest
    container_name: dishgenie_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-dishgenie_minioadmin} ${MINIO_SECRET_KEY:-dishgenie_miniopassword};
      /usr/bin/mc mb --ignore-existing myminio/${MINIO_BUCKET_NAME:-dishgenie-bucket};
      /usr/bin/mc anonymous set download myminio/${MINIO_BUCKET_NAME:-dishgenie-bucket};
      exit 0;
      "

  # 6. Ollama Local LLM Engine Service
  ollama:
    image: ollama/ollama:latest
    container_name: dishgenie_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 6b. One-shot Model Puller for Ollama
  ollama-model-setup:
    image: curlimages/curl:latest
    container_name: dishgenie_ollama_setup
    depends_on:
      - ollama
    entrypoint: >
      /bin/sh -c "
      echo 'Ensuring Ollama model ${OLLAMA_MODEL:-qwen2.5:0.5b} is loaded...';
      curl -s -X POST http://ollama:11434/api/pull -d '{\"name\": \"${OLLAMA_MODEL:-qwen2.5:0.5b}\"}';
      exit 0;
      "

  # 7. FastAPI Application Service
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: dishgenie_app
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-dishgenie_user}:${POSTGRES_PASSWORD:-dishgenie_password}@postgres:5432/${POSTGRES_DB:-dishgenie_db}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dishgenie_minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dishgenie_miniopassword}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-dishgenie-bucket}
      MINIO_SECURE: "False"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-dishgenie_rmq_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dishgenie_rmq_password}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME:-dishgenie_tasks}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTO_START_WORKER: "True"
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-""}
    ports:
      - "8000:8000"
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started

  # 8. Background Task Worker Service
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: dishgenie_worker
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-dishgenie_user}:${POSTGRES_PASSWORD:-dishgenie_password}@postgres:5432/${POSTGRES_DB:-dishgenie_db}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-dishgenie_minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-dishgenie_miniopassword}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-dishgenie-bucket}
      MINIO_SECURE: "False"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-dishgenie_rmq_user}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-dishgenie_rmq_password}
      RABBITMQ_QUEUE_NAME: ${RABBITMQ_QUEUE_NAME:-dishgenie_tasks}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-""}
    volumes:
      - ..:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ollama:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # 9. Web Frontend UI & Reverse Proxy Gateway
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
    container_name: dishgenie_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../frontend:/usr/share/nginx/html
    depends_on:
      - app

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
  ollama_data:
